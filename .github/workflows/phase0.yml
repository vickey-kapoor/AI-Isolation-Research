name: phase0

on:
  push:
    paths: ["phase0/**", ".github/workflows/phase0.yml"]
  pull_request:
    paths: ["phase0/**", ".github/workflows/phase0.yml"]

jobs:
  airlock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m airlock.demo

  gvisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install runsc and build the rootfs
        run: ./sandboxes/setup_gvisor.sh "$RUNNER_TEMP/rootfs"
      - name: Run the habitat under gVisor
        run: sudo "$(which python)" -m sandboxes.run_gvisor --rootfs "$RUNNER_TEMP/rootfs" --work "$RUNNER_TEMP/work"
      - name: Show runsc logs on failure
        if: failure()
        run: sudo GVISOR_DEBUG=1 "$(which python)" -m sandboxes.run_gvisor --rootfs "$RUNNER_TEMP/rootfs" --work "$RUNNER_TEMP/work-debug" || sudo find "$RUNNER_TEMP/work-debug/runsc-logs" -type f -exec tail -n 40 {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvisor-report
          path: ${{ runner.temp }}/work/report.json
          if-no-files-found: ignore

  firecracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check KVM is available
        run: ls -l /dev/kvm
      - name: Install Firecracker, fetch the guest kernel, build the rootfs
        run: ./sandboxes/setup_firecracker.sh "$RUNNER_TEMP/fc"
      - name: Run the habitat in a Firecracker microVM
        run: sudo "$(which python)" -m sandboxes.run_firecracker --kernel "$RUNNER_TEMP/fc/vmlinux" --rootfs "$RUNNER_TEMP/fc/rootfs" --work "$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firecracker-report
          path: ${{ runner.temp }}/work/report.json
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0/infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  stacked:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install gVisor
        run: ./sandboxes/setup_gvisor.sh "$RUNNER_TEMP/gv-rootfs"
      - name: Install Firecracker, fetch the guest kernel, build the rootfs
        run: ./sandboxes/setup_firecracker.sh "$RUNNER_TEMP/fc"
      - name: Run the habitat with gVisor inside a Firecracker VM
        run: sudo "$(which python)" -m sandboxes.run_stacked --kernel "$RUNNER_TEMP/fc/vmlinux" --rootfs "$RUNNER_TEMP/fc/rootfs" --work "$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacked-report
          path: ${{ runner.temp }}/work/report.json
          if-no-files-found: ignore
